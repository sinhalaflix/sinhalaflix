<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preparing Download | SinhalaFlix Hub</title>
  <meta name="description" content="Secure download link preparation for SinhalaFlix Hub movies and episodes." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #f59e0b;
      --emerald: #10b981;
      --bg: #060911;
      --card: rgba(15,22,40,0.9);
      --border: rgba(255,255,255,0.08);
      --text: #f8fafc;
      --text2: #94a3b8;
      --text3: #64748b;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(circle at 20% 30%, rgba(245,158,11,0.07) 0%, transparent 45%),
        radial-gradient(circle at 80% 70%, rgba(16,185,129,0.06) 0%, transparent 45%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* ── Card ── */
    .dw-card {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 24px 80px rgba(0,0,0,0.8), 0 0 40px rgba(245,158,11,0.06);
      text-align: center;
    }

    /* ── Title info ── */
    .dw-poster {
      width: 90px;
      height: 135px;
      object-fit: cover;
      border-radius: 10px;
      margin: 0 auto 1.25rem;
      display: block;
      box-shadow: 0 8px 30px rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.07);
    }
    .dw-title {
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 0.2rem;
      line-height: 1.3;
    }
    .dw-subtitle {
      font-size: 0.85rem;
      color: var(--text2);
      margin-bottom: 1.75rem;
    }

    /* ── Countdown ring ── */
    .dw-ring-wrap {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 1.5rem;
    }
    .dw-ring-svg {
      transform: rotate(-90deg);
      width: 120px;
      height: 120px;
    }
    .dw-ring-track {
      fill: none;
      stroke: rgba(255,255,255,0.06);
      stroke-width: 8;
    }
    .dw-ring-prog {
      fill: none;
      stroke: var(--gold);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 314.16;      /* 2π × 50 */
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear, stroke 0.4s;
      filter: drop-shadow(0 0 8px rgba(245,158,11,0.5));
    }
    .dw-ring-prog.almost-done {
      stroke: var(--emerald);
      filter: drop-shadow(0 0 10px rgba(16,185,129,0.6));
    }
    .dw-ring-num {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      font-weight: 900;
      line-height: 1;
      color: var(--gold);
      transition: color 0.4s;
    }
    .dw-ring-num.almost-done { color: var(--emerald); }
    .dw-ring-num span {
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--text2);
      margin-top: 0.15rem;
      letter-spacing: 0.05em;
    }

    .dw-msg {
      font-size: 0.9rem;
      color: var(--text2);
      margin-bottom: 1.25rem;
    }

    /* ── Notice below countdown ── */
    .dw-notice {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.85rem 1.1rem;
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.28);
      border-radius: 10px;
      color: var(--text2);
      font-size: 0.84rem;
      line-height: 1.6;
      text-align: left;
      margin-bottom: 1.5rem;
    }
    .dw-notice strong {
      color: #fbbf24;
      font-weight: 600;
    }
    .dw-notice-icon {
      font-size: 1.25rem;
      flex-shrink: 0;
      margin-top: 0.05rem;
    }

    /* ── Ad placeholder ── */
    .dw-ad-slot {
      background: rgba(255,255,255,0.02);
      border: 1px dashed rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 0.75rem;
      margin-bottom: 1.5rem;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: var(--text3);
    }

    /* ── Mirror links (hidden until countdown done) ── */
    .dw-mirrors {
      display: none;
      flex-direction: column;
      gap: 0.65rem;
      animation: fadeUp 0.5s ease;
    }
    .dw-mirrors.visible { display: flex; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .dw-mirror-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.25rem;
      background: rgba(20,30,55,0.7);
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: border-color 0.2s;
      text-decoration: none;
    }
    .dw-mirror-row:hover { border-color: rgba(245,158,11,0.4); }

    .dw-mirror-info { display: flex; align-items: center; gap: 0.75rem; text-align: left; }
    .dw-mirror-icon { font-size: 1.4rem; flex-shrink: 0; }
    .dw-mirror-name { font-weight: 700; font-size: 0.9rem; color: var(--text); }
    .dw-mirror-meta { font-size: 0.75rem; color: var(--text2); margin-top: 0.05rem; }

    .dw-btn {
      flex-shrink: 0;
      padding: 0.5rem 1.25rem;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      font-weight: 700;
      font-size: 0.85rem;
      border-radius: 8px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s;
    }
    .dw-btn:hover { opacity: 0.88; }

    .dw-back {
      display: inline-block;
      margin-top: 1.5rem;
      font-size: 0.82rem;
      color: var(--text3);
      text-decoration: none;
      transition: color 0.2s;
    }
    .dw-back:hover { color: var(--gold); }

    /* No mirrors message */
    .dw-no-mirrors {
      font-size: 0.88rem;
      color: var(--text3);
      padding: 1.25rem;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="dw-card">
    <!-- Poster -->
    <img class="dw-poster" id="dwPoster" src="assets/images/banner1.jpg" alt="Poster" />

    <!-- Title -->
    <div class="dw-title" id="dwTitle">Preparing Download…</div>
    <div class="dw-subtitle" id="dwSubtitle">Please wait while we prepare your file</div>

    <!-- Countdown ring -->
    <div class="dw-ring-wrap" id="dwRingWrap">
      <svg class="dw-ring-svg" viewBox="0 0 120 120">
        <circle class="dw-ring-track" cx="60" cy="60" r="50"/>
        <circle class="dw-ring-prog" id="dwRingProg" cx="60" cy="60" r="50"/>
      </svg>
      <div class="dw-ring-num" id="dwRingNum">
        10
        <span>SECONDS</span>
      </div>
    </div>

    <p class="dw-msg" id="dwMsg">🔒 Your download links will appear in <strong id="dwMsgSec">10</strong> seconds…</p>

    <!-- Ad Notice -->
    <div class="dw-notice">
      <span class="dw-notice-icon">🚨</span>
      <div>
        <strong>වැදගත්:</strong> වෙනත් සයිට් එකකට Redirect වුණොත් 🕒 තත්පර කිහිපයක් රැඳී සිට <strong>Back</strong> වී, ⬇️ <strong>Download Button</strong> එක නැවත Click කරන්න.
      </div>
    </div>

    <!-- Ad slot (Monetag scripts will be injected here) -->
    <div class="dw-ad-slot" id="dwAdSlot"></div>

    <!-- Mirror download links — revealed after countdown -->
    <div class="dw-mirrors" id="dwMirrors">
      <!-- Populated by JS -->
    </div>

    <a href="#" class="dw-back" id="dwBackLink">← Go Back to Movie Page</a>
  </div>

  <script src="js/data.js?v=20260913_7"></script>
  <script src="js/storage.js?v=20260913_7"></script>
  <script>
    /* ─────────────────────────────────────────
       Parse URL params
       ?id=CONTENT_ID & ep=EP_INDEX
       ───────────────────────────────────────── */
    const params     = new URLSearchParams(window.location.search);
    const contentId  = params.get("id")  || "";
    const epIdx      = parseInt(params.get("ep") || "0", 10);
    const backUrl    = `movie.html?id=${contentId}`;

    // Back link
    document.getElementById("dwBackLink").href = backUrl;

    /* ─────────────────────────────────────────
       Populate item info
       ───────────────────────────────────────── */
    const catalog = StorageService.getFullCatalog();
    const item    = catalog.find(c => c.id === contentId);

    if (!item) {
      document.getElementById("dwTitle").textContent    = "Content not found";
      document.getElementById("dwSubtitle").textContent = "Please go back and try again.";
    } else {
      document.getElementById("dwPoster").src           = item.poster;
      document.getElementById("dwPoster").alt           = item.titleEnglish;
      document.getElementById("dwTitle").textContent    = item.titleEnglish;

      const ep = item.episodes?.[epIdx];
      const epLabel = ep ? ` — Episode ${ep.epNumber || epIdx + 1}` : "";
      document.getElementById("dwSubtitle").textContent = item.titleSinhala + epLabel;
    }

    /* ─────────────────────────────────────────
       Inject Monetag ads
       ───────────────────────────────────────── */
    const adSlot = document.getElementById("dwAdSlot");
    try {
      const settings = JSON.parse(localStorage.getItem("sinhalaflix_settings_v1") || "{}");
      const adLinks  = [settings.monetagAd1, settings.monetagAd2].filter(Boolean);
      if (adLinks.length) {
        adLinks.forEach(src => {
          const s = document.createElement("script");
          s.src   = src;
          s.async = true;
          adSlot.appendChild(s);
        });
        adSlot.style.minHeight = "100px";
      } else {
        adSlot.style.display = "none";
      }
    } catch (_) {
      adSlot.style.display = "none";
    }

    /* ─────────────────────────────────────────
       10-second countdown
       ───────────────────────────────────────── */
    const TOTAL     = 10;
    const CIRCUMF   = 314.16; // 2π × 50
    const prog      = document.getElementById("dwRingProg");
    const numEl     = document.getElementById("dwRingNum");
    const msgSecEl  = document.getElementById("dwMsgSec");
    const msgEl     = document.getElementById("dwMsg");
    const mirrorsEl = document.getElementById("dwMirrors");
    const ringWrap  = document.getElementById("dwRingWrap");

    let remaining = TOTAL;

    function updateRing(secs) {
      const ratio  = secs / TOTAL;
      const offset = CIRCUMF * (1 - ratio);
      prog.style.strokeDashoffset = offset;
      numEl.childNodes[0].textContent = secs;
      if (msgSecEl) msgSecEl.textContent = secs;

      const almostDone = secs <= 3;
      prog.classList.toggle("almost-done",   almostDone);
      numEl.classList.toggle("almost-done",  almostDone);
    }

    function showMirrors() {
      ringWrap.style.display = "none";
      msgEl.innerHTML = "✅ <strong>Your download is ready!</strong> Choose a mirror below:";

      // Build mirror links
      const ep = item?.episodes?.[epIdx];
      const dl = ep?.downloads || item?.downloads || {};

      const links = [];
      if (dl.gdrive && dl.gdrive.trim()) {
        links.push({ icon: "☁️", name: "Google Drive", meta: "Stable Mirror", url: dl.gdrive.trim() });
      }
      if (dl.buzz && dl.buzz.trim()) {
        links.push({ icon: "⚡", name: "Server 2", meta: "Direct High Speed Mirror", url: dl.buzz.trim() });
      }
      // Fallback keys from old data structure
      if (!links.length && dl.hd)  links.push({ icon: "☁️", name: "Google Drive", meta: "Stable Mirror", url: dl.hd.trim() });
      if (!links.length && dl.fhd) links.push({ icon: "☁️", name: "Google Drive", meta: "Stable Mirror", url: dl.fhd.trim() });

      if (!links.length) {
        mirrorsEl.innerHTML = `<div class="dw-no-mirrors">⚠️ No download links available for this content.</div>`;
      } else {
        mirrorsEl.innerHTML = links.map(l => `
          <div class="dw-mirror-row">
            <div class="dw-mirror-info">
              <span class="dw-mirror-icon">${l.icon}</span>
              <div>
                <div class="dw-mirror-name">${l.name}</div>
                <div class="dw-mirror-meta">${l.meta}</div>
              </div>
            </div>
            <a href="${l.url}" target="_blank" rel="noopener noreferrer" class="dw-btn" download>
              ⬇ Download
            </a>
          </div>
        `).join("");
      }

      mirrorsEl.classList.add("visible");
    }

    // Start countdown
    updateRing(remaining);
    const timer = setInterval(() => {
      remaining--;
      if (remaining <= 0) {
        clearInterval(timer);
        updateRing(0);
        showMirrors();
      } else {
        updateRing(remaining);
      }
    }, 1000);
  </script>
</body>
</html>
